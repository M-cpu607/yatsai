<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lecteur Yatsai</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #lecteur, iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="lecteur"></div>
<script>
/*
 * Page relais du lecteur YouTube de Yatsai.
 *
 * Pourquoi elle existe : dans l'application iOS, la page tourne sous le
 * schéma capacitor://localhost. Une iframe YouTube posée là n'envoie aucun
 * référent http(s), et YouTube refuse de jouer (« erreur 153 »). Servie
 * depuis une vraie adresse https, cette page donne au lecteur le référent
 * qui lui manque.
 *
 * Elle fait partie du site, servie par Vercel à /lecteur-youtube/ : Supabase
 * réécrit en text/plain tout HTML servi par ses fonctions Edge comme par son
 * Storage, le script ne s'y exécuterait jamais.
 *
 * Elle passe par l'API officielle du lecteur, seule voie qui remonte un
 * code d'erreur, et transmet l'issue à l'application par postMessage.
 * Chaque étape est aussi signalée à une fonction Edge du projet, pour
 * qu'elle apparaisse dans les journaux et se lise à distance.
 *
 * Utilisation : https://<hôte>/?v=<identifiant YouTube de 11 caractères>
 */
(function () {
  var JOURNAL = 'https://uvsxteuhqqfgbmdgabfo.supabase.co/functions/v1/lecteur-youtube';
  // Au-delà, on considère que le lecteur ne démarrera pas. Doit rester sous
  // le délai de secours de l'application (9 s), pour que ce soit cette page
  // qui explique, plutôt que l'application qui conclue à son silence.
  var DELAI_SANS_REPONSE_MS = 6000;

  var brut = new URLSearchParams(location.search).get('v') || '';
  // L'identifiant ne passe jamais par du HTML : il n'est remis qu'à l'API,
  // en tant que chaîne. La validation écarte tout le reste d'emblée.
  var ID = /^[A-Za-z0-9_-]{11}$/.test(brut) ? brut : null;
  var repondu = false;

  function journaliser(etiquette) {
    var u = JOURNAL + '?v=' + encodeURIComponent(ID || 'invalide')
          + '&journal=' + encodeURIComponent(etiquette);
    try {
      if (navigator.sendBeacon && navigator.sendBeacon(u)) return;
    } catch (e) { /* on tente l'image */ }
    try { new Image().src = u; } catch (e) { /* tant pis */ }
  }

  function versApp(message) {
    message.source = 'lecteur-youtube';
    journaliser(message.type
      + (message.code != null ? '-' + message.code : '')
      + (message.valeur != null ? '-' + message.valeur : ''));
    try { parent.postMessage(message, '*'); } catch (e) { /* sans parent */ }
  }

  function signaler(message) {
    if (repondu) return;
    repondu = true;
    versApp(message);
  }

  journaliser('page-chargee');

  if (!ID) {
    signaler({ type: 'erreur', code: 2 });
    return;
  }

  // L'API n'émet aucun événement quand elle n'arrive pas à s'initialiser :
  // sans ce délai, l'application attendrait indéfiniment.
  setTimeout(function () { signaler({ type: 'silence' }); }, DELAI_SANS_REPONSE_MS);

  window.onYouTubeIframeAPIReady = function () {
    new YT.Player('lecteur', {
      videoId: ID,
      playerVars: {
        autoplay: 1, playsinline: 1, rel: 0,
        // iOS refuse le démarrage automatique d'une vidéo sonore : le
        // lecteur resterait sur une image noire. Le son se rallume depuis
        // les commandes du lecteur.
        mute: 1,
        // Désigne la page qui héberge le lecteur — celle-ci, et non
        // l'application qui l'englobe.
        origin: location.origin
      },
      events: {
        onReady: function () { signaler({ type: 'pret' }); },
        // -1 non démarré, 0 terminé, 1 lecture, 2 pause, 3 tampon, 5 en file.
        onStateChange: function (e) { versApp({ type: 'etat', valeur: e && e.data }); },
        onError: function (e) { signaler({ type: 'erreur', code: e && e.data }); }
      }
    });
  };

  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onload = function () { journaliser('api-chargee'); };
  s.onerror = function () { signaler({ type: 'api-injoignable' }); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
